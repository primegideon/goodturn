name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: |
          if [ -f "template.yaml" ]; then
            sam validate --lint
          else
            echo "template.yaml not found, skipping validation."
          fi

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
            pytest tests/
          else
            echo "requirements-dev.txt not found, skipping tests."
          fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend application
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci || npm install
            npm run build
          else
            echo "frontend directory not found, skipping build."
          fi
